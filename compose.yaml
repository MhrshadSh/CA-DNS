# CA-DNS service stack.
#
# Configuration is baked into images (production-like) or passed through
# environment variables from .env; data lives in named volumes. Passwords and
# API tokens are Docker secrets: files under ./secrets (created by
# `make secrets`, gitignored), mounted read-only at /run/secrets and read at
# start-up by the images' entrypoint, so they never appear in this file, in the
# environment of the compose project, or in `docker inspect`.

name: cadns

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6}-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadns}
      POSTGRES_USER: ${POSTGRES_USER:-cadns_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 200
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: apply db/migrations, then exit. Later services depend on it with
  # condition: service_completed_successfully.
  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-18.6}
    image: cadns-migrate:dev
    restart: "no"
    # The postgres base image declares VOLUME /var/lib/postgresql; mount a tmpfs
    # there so client-only runs don't leave anonymous volumes behind.
    tmpfs:
      - /var/lib/postgresql
    environment: &db-owner-env
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cadns}
      PGUSER: ${POSTGRES_USER:-cadns_owner}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      CADNS_DLZ_PASSWORD_FILE: /run/secrets/cadns_dlz_password
      CADNS_APP_PASSWORD_FILE: /run/secrets/cadns_app_password
      # Separate database for the services' tests (dev/CI only).
      CADNS_TEST_DATABASE: ${CADNS_TEST_DATABASE:-cadns_test}
    secrets: &owner-secrets
      - postgres_password
      - cadns_dlz_password
      - cadns_app_password
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  # BIND 9.20 + dlz_pgsql: answers measured names from PostgreSQL, recurses
  # for everything else (docs/architecture.md).
  resolver:
    build:
      context: .
      dockerfile: resolver/Dockerfile
    image: cadns-resolver:dev
    restart: unless-stopped
    environment:
      # libpq settings for the DLZ module (least-privilege role).
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cadns}
      PGUSER: cadns_dlz
      PGPASSWORD_FILE: /run/secrets/cadns_dlz_password
    secrets:
      - cadns_dlz_password
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 200
    ports:
      - "${RESOLVER_LISTEN:-127.0.0.1}:53:53/udp"
      - "${RESOLVER_LISTEN:-127.0.0.1}:53:53/tcp"
    volumes:
      # dnstap socket, created by the collector.
      - dnstap:/run/cadns
    networks:
      - backend
      - frontend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Reads BIND's dnstap stream: hits update activity, misses are queued.
  # Prometheus metrics are on :9100 inside each service container (scrape them
  # from the backend network; nothing is published to the host).
  collector:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: runtime
    image: cadns-services:dev
    command: ["collector"]
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cadns}
      PGUSER: cadns_app
      PGPASSWORD_FILE: /run/secrets/cadns_app_password
    secrets:
      - cadns_app_password
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "cadns", "healthcheck", "collector", "--max-age", "30"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - dnstap:/run/cadns
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Consumes the measurement queue: resolve, geolocate, attach MOER, store.
  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: runtime
    image: cadns-services:dev
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment: &app-env
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cadns}
      PGUSER: cadns_app
      PGPASSWORD_FILE: /run/secrets/cadns_app_password
      CADNS_WATTTIME_USERNAME: ${CADNS_WATTTIME_USERNAME:-}
      CADNS_WATTTIME_PASSWORD_FILE: /run/secrets/watttime_password
      CADNS_IPINFO_TOKEN_FILE: /run/secrets/ipinfo_token
    secrets: &app-secrets
      - cadns_app_password
      - watttime_password
      - ipinfo_token
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 100
    healthcheck:
      test: ["CMD", "cadns", "healthcheck", "worker", "--max-age", "60"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      # The IPinfo MMDB, if you have one (make ipinfo-db).
      - ./data/ipinfo:/data/ipinfo:ro
    networks:
      - backend
      - frontend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Keeps active domains and carbon signals fresh; removes inactive data.
  monitor:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: runtime
    image: cadns-services:dev
    command: ["monitor"]
    restart: unless-stopped
    stop_grace_period: 15s
    environment: *app-env
    secrets: *app-secrets
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "cadns", "healthcheck", "monitor", "--max-age", "60"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend
      - frontend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off service commands: make measure d=<domain>.
  cli:
    profiles: [tools]
    build:
      context: .
      dockerfile: services/Dockerfile
      target: runtime
    image: cadns-services:dev
    restart: "no"
    environment: *app-env
    secrets: *app-secrets
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 100
    volumes:
      # Runtime data (gitignored): the IPinfo MMDB, if you have one (make ipinfo-db).
      - ./data/ipinfo:/data/ipinfo:ro
    networks:
      - backend
      - frontend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Unit + database tests for the Python services (make test). The backend
  # network is internal, so these tests cannot reach the Internet.
  services-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: services/Dockerfile
      target: test
    image: cadns-services-tests:dev
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${CADNS_TEST_DATABASE:-cadns_test}
      PGUSER: cadns_app
      PGPASSWORD_FILE: /run/secrets/cadns_app_password
    secrets:
      - cadns_app_password
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Integration tests (make test). Runs as the owner inside rolled-back
  # transactions, so the dev database is left untouched.
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    image: cadns-tests:dev
    restart: "no"
    environment: *db-owner-env
    secrets: *owner-secrets
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      resolver:
        condition: service_healthy
      collector:
        condition: service_started
      worker:
        condition: service_started

networks:
  # Services that only talk to each other (postgres). Services that need the
  # Internet (resolver, worker) also join frontend.
  backend:
    internal: true
  # Internet access for recursion (resolver) and, later, upstream APIs (worker).
  frontend:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  cadns_dlz_password:
    file: ./secrets/cadns_dlz_password
  cadns_app_password:
    file: ./secrets/cadns_app_password
  # Empty files are fine: without credentials MOER and geolocation stay unknown.
  watttime_password:
    file: ./secrets/watttime_password
  ipinfo_token:
    file: ./secrets/ipinfo_token

volumes:
  pgdata:
  # Unix socket between BIND (dnstap writer) and the collector.
  dnstap:
