# CA-DNS service stack.
#
# Configuration is baked into images (production-like) or passed through
# environment variables from .env; data lives in named volumes.

name: cadns

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6}-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadns}
      POSTGRES_USER: ${POSTGRES_USER:-cadns_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (run `make env`)}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: apply db/migrations, then exit. Later services depend on it with
  # condition: service_completed_successfully.
  migrate:
    build:
      context: ./db
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-18.6}
    image: cadns-migrate:dev
    restart: "no"
    # The postgres base image declares VOLUME /var/lib/postgresql; mount a tmpfs
    # there so client-only runs don't leave anonymous volumes behind.
    tmpfs:
      - /var/lib/postgresql
    environment: &db-owner-env
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cadns}
      PGUSER: ${POSTGRES_USER:-cadns_owner}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CADNS_DLZ_PASSWORD: ${CADNS_DLZ_PASSWORD:?set CADNS_DLZ_PASSWORD in .env (run `make env`)}
      CADNS_APP_PASSWORD: ${CADNS_APP_PASSWORD:?set CADNS_APP_PASSWORD in .env (run `make env`)}
      # Separate database for the services' tests (dev/CI only).
      CADNS_TEST_DATABASE: ${CADNS_TEST_DATABASE:-cadns_test}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  # BIND 9.20 + dlz_pgsql: answers measured names from PostgreSQL, recurses
  # for everything else (docs/architecture.md).
  resolver:
    build:
      context: ./resolver
    image: cadns-resolver:dev
    restart: unless-stopped
    environment:
      # libpq settings for the DLZ module (least-privilege role).
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cadns}
      PGUSER: cadns_dlz
      PGPASSWORD: ${CADNS_DLZ_PASSWORD}
    ports:
      - "${RESOLVER_LISTEN:-127.0.0.1}:53:53/udp"
      - "${RESOLVER_LISTEN:-127.0.0.1}:53:53/tcp"
    volumes:
      # dnstap socket, created by the collector.
      - dnstap:/run/cadns
    networks:
      - backend
      - frontend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Reads BIND's dnstap stream: hits update activity, misses are queued.
  collector:
    build:
      context: ./services
      target: runtime
    image: cadns-services:dev
    command: ["collector"]
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cadns}
      PGUSER: cadns_app
      PGPASSWORD: ${CADNS_APP_PASSWORD}
    volumes:
      - dnstap:/run/cadns
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Consumes the measurement queue: resolve, geolocate, attach MOER, store.
  worker:
    build:
      context: ./services
      target: runtime
    image: cadns-services:dev
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment: &app-env
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cadns}
      PGUSER: cadns_app
      PGPASSWORD: ${CADNS_APP_PASSWORD}
      CADNS_IPINFO_TOKEN: ${CADNS_IPINFO_TOKEN:-}
      CADNS_WATTTIME_USERNAME: ${CADNS_WATTTIME_USERNAME:-}
      CADNS_WATTTIME_PASSWORD: ${CADNS_WATTTIME_PASSWORD:-}
    volumes:
      - ./data/ipinfo:/data/ipinfo:ro
    networks:
      - backend
      - frontend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off service commands: make measure d=<domain>.
  cli:
    profiles: [tools]
    build:
      context: ./services
      target: runtime
    image: cadns-services:dev
    restart: "no"
    environment: *app-env
    volumes:
      # Runtime data (gitignored): the IPinfo MMDB, if you have one (make ipinfo-db).
      - ./data/ipinfo:/data/ipinfo:ro
    networks:
      - backend
      - frontend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Unit + database tests for the Python services (make test). The backend
  # network is internal, so these tests cannot reach the Internet.
  services-tests:
    profiles: [test]
    build:
      context: ./services
      target: test
    image: cadns-services-tests:dev
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${CADNS_TEST_DATABASE:-cadns_test}
      PGUSER: cadns_app
      PGPASSWORD: ${CADNS_APP_PASSWORD}
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Integration tests (make test). Runs as the owner inside rolled-back
  # transactions, so the dev database is left untouched.
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    image: cadns-tests:dev
    restart: "no"
    environment: *db-owner-env
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      resolver:
        condition: service_healthy
      collector:
        condition: service_started
      worker:
        condition: service_started

networks:
  # Services that only talk to each other (postgres). Services that need the
  # Internet (resolver, worker) also join frontend.
  backend:
    internal: true
  # Internet access for recursion (resolver) and, later, upstream APIs (worker).
  frontend:

volumes:
  pgdata:
  # Unix socket between BIND (dnstap writer) and the collector.
  dnstap:
